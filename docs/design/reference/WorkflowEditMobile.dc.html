<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Locke — Workflow builder, mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="locke.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="lk lk-{{theme}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg)">

  <header style="padding: 47px 12px 0 8px; height: 103px; display: flex; align-items: center; gap: 4px">
    <a href="WorkflowsMobile.dc.html" class="icon-btn" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1 class="t-title-m clamp1" style="flex: 1">Portraits</h1>
    <span class="switch is-on" role="switch" aria-checked="true" aria-label="Workflow active" style="margin-right: 8px"></span>
    <button class="btn btn-primary btn-sm" style="min-height: 40px">Save</button>
  </header>

  <main class="flow" style="padding: 0 16px">
    <div class="flow-step is-on">
      <span class="flow-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"></path></svg></span>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
        <span class="t-label">New images in</span>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <button class="chip chip-sm" aria-pressed="true"><svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 7v5l3 2"></path></svg>Morning lighthouse</button>
          <button class="chip chip-sm" aria-pressed="true"><svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1 0 9z"></path></svg>Story refs</button>
          <button class="chip chip-sm" aria-label="Add source"><svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></button>
        </div>
      </div>
    </div>
    <div class="flow-join"></div>

    <div class="flow-step is-on" style="align-items: center">
      <span class="flow-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2 M12 19v2 M3 12h2 M19 12h2 M5.6 5.6 7 7 M17 17l1.4 1.4 M5.6 18.4 7 17 M17 7l1.4-1.4 M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg></span>
      <span class="t-label" style="flex: 1">Enhance</span>
      <button class="icon-btn" aria-label="Remove Enhance step" style="width: 32px; height: 32px"><svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12 M18 6 6 18"></path></svg></button>
    </div>
    <div class="flow-join"></div>

    <div class="flow-step is-on" style="align-items: center">
      <span class="flow-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M17 20a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M13 6h4a2 2 0 0 1 2 2v3 M11 18H7a2 2 0 0 1-2-2v-3"></path></svg></span>
      <span class="t-label">Face swap</span>
      <div style="display: flex; gap: 6px; align-items: center; flex: 1; justify-content: flex-end">
        <button class="chip chip-sm" aria-pressed="true" style="padding-left: 3px"><img src="/_blob/d841ff50912394cbfa20e00483e2fecb" alt="" style="width: 26px; height: 26px; border-radius: 50%; object-fit: cover; object-position: 50% 38%">Rose</button>
        <button class="chip chip-sm" aria-label="Add character"><svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></button>
      </div>
    </div>
    <div class="flow-join"></div>
    <button class="flow-step" style="background: transparent; border-style: dashed; color: var(--text-2); cursor: pointer; align-items: center; font: 500 14px/18px var(--font-ui)"><span class="flow-icon" style="background: transparent"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></span>Add step</button>
    <div class="flow-join"></div>

    <div class="flow-step is-on">
      <span class="flow-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 3v18 M16 5v14 M20 9v6"></path></svg></span>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 8px"><span class="t-label" style="flex: 1">Blur</span><span class="pill">Always last</span><span class="switch is-on" role="switch" aria-checked="true" aria-label="Blur step on"></span></div>
        <div class="range" role="slider" aria-label="Blur strength" aria-valuemin="0" aria-valuemax="100" aria-valuenow="45" tabindex="0"><span class="range-track"></span><span class="range-fill" style="width: 45%"></span><span class="range-thumb" style="left: 45%"></span></div>
        <span class="t-caption" style="display: flex; align-items: center; gap: 6px"><svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="M9 14 4 9l5-5 M4 9h11a5 5 0 0 1 0 10h-3"></path></svg>Removable later, image by image</span>
      </div>
    </div>

    <div style="margin-top: 6px; padding: 12px 14px; border-radius: 18px; background: var(--surface-2); display: flex; align-items: center; gap: 12px; margin-right: 72px">
      <div style="display: flex; align-items: center; gap: 4px" aria-hidden="true">
        <img src="/_blob/d841ff50912394cbfa20e00483e2fecb" alt="" style="width: 30px; height: 38px; border-radius: 8px; object-fit: cover; filter: saturate(.6)">
        <svg class="ic ic-16" viewBox="0 0 24 24" style="color: var(--text-3)"><path d="M5 12h14 M13 6l6 6-6 6"></path></svg>
        <img src="/_blob/d841ff50912394cbfa20e00483e2fecb" alt="" style="width: 30px; height: 38px; border-radius: 8px; object-fit: cover; filter: blur(1.5px)">
      </div>
      <span class="t-body-s"><strong>1 result</strong> per new image</span>
    </div>
  </main>

  <button class="assist" aria-label="Open assistant" style="bottom: 44px"><svg class="ic ic-24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.9L19 9.7l-5.2 1.9L12 16.5l-1.8-4.9L5 9.7l5.2-1.8z M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"></path></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
