<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Locke — Editor, mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="locke.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="lk lk-{{theme}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--image-bg)">

  <header style="position: absolute; left: 0; right: 0; top: 0; padding: 47px 8px 0; height: 103px; display: flex; align-items: center; gap: 4px; background: var(--bg)">
    <a href="EditorPickMobile.dc.html" class="icon-btn" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1 class="t-title-s clamp1" style="flex: 1">Café scene</h1>
    <button class="icon-btn" aria-label="Compare with original"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18 M8 6H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3 M16 6h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-3"></path></svg></button>
    <button class="icon-btn" aria-label="More: save to documents, download, delete"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="M5 12h.01 M12 12h.01 M19 12h.01"></path></svg></button>
  </header>

  <img src="/_blob/b98f848812490c10d9dfbf0ebffcc2f1" alt="Café scene with two people" style="position: absolute; left: 0; top: 112px; width: 390px; height: 260px; object-fit: cover; display: block">
  <sc-if value="{{isBlur}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 0; top: 112px; width: 390px; height: 260px; overflow: hidden"><img src="/_blob/b98f848812490c10d9dfbf0ebffcc2f1" alt="" style="width: 100%; height: 100%; object-fit: cover; filter: blur(2.5px); transform: scale(1.03)"></div></sc-if>

  <div role="list" aria-label="History" style="position: absolute; left: 0; right: 0; top: 382px; padding: 0 16px; display: flex; gap: 6px; align-items: flex-start">
    <a role="listitem" href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--text-3)"><img src="/_blob/b98f848812490c10d9dfbf0ebffcc2f1" alt="" style="width: 52px; height: 36px; border-radius: 8px; object-fit: cover; filter: saturate(.6)"><span class="t-caption" style="font-size: 11px">Original</span></a>
    <svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-3); margin-top: 10px"><path d="M9 6l6 6-6 6"></path></svg>
    <a role="listitem" href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--text-3)"><img src="/_blob/b98f848812490c10d9dfbf0ebffcc2f1" alt="" style="width: 52px; height: 36px; border-radius: 8px; object-fit: cover"><span class="t-caption" style="font-size: 11px">Enhanced</span></a>
    <svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-3); margin-top: 10px"><path d="M9 6l6 6-6 6"></path></svg>
    <a role="listitem" href="#" aria-current="{{fsCur}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--text)"><img src="/_blob/b98f848812490c10d9dfbf0ebffcc2f1" alt="" style="width: 52px; height: 36px; border-radius: 8px; object-fit: cover; outline: 2px solid {{fsRing}}; outline-offset: 1px"><span class="t-caption" style="font-size: 11px; color: var(--text)">Ana + Milo</span></a>
    <sc-if value="{{isBlur}}" hint-placeholder-val="{{false}}">
      <svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-3); margin-top: 10px"><path d="M9 6l6 6-6 6"></path></svg>
      <a role="listitem" href="#" aria-current="true" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--text)"><span style="width: 52px; height: 36px; border-radius: 8px; overflow: hidden; outline: 2px solid var(--info-border); outline-offset: 1px; display: block"><img src="/_blob/b98f848812490c10d9dfbf0ebffcc2f1" alt="" style="width: 100%; height: 100%; object-fit: cover; filter: blur(1.5px)"></span><span class="t-caption" style="font-size: 11px; color: var(--text)">Blur</span></a>
    </sc-if>
  </div>

  <section class="sheet" aria-label="Tools" style="position: absolute; left: 0; right: 0; bottom: 0; height: 382px; padding: 0 16px; display: flex; flex-direction: column; gap: 14px">
    <div class="grabber"></div>
    <div role="tablist" aria-label="Tool" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <button role="tab" aria-selected="false" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-radius: 16px; border: 1px solid transparent; background: transparent; color: var(--text-2); cursor: pointer; font: 500 12px/16px var(--font-ui)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2 M12 19v2 M3 12h2 M19 12h2 M5.6 5.6 7 7 M17 17l1.4 1.4 M5.6 18.4 7 17 M17 7l1.4-1.4 M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg>Enhance</button>
      <button role="tab" aria-selected="{{blurSel}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-radius: 16px; border: 1px solid {{blurBd}}; background: {{blurBg}}; color: {{blurFg}}; cursor: pointer; font: 500 12px/16px var(--font-ui)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 3v18 M16 5v14 M20 9v6"></path></svg>Blur</button>
      <button role="tab" aria-selected="{{fsSel}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-radius: 16px; border: 1px solid {{fsBd}}; background: {{fsBg}}; color: {{fsFg}}; cursor: pointer; font: 500 12px/16px var(--font-ui)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M17 20a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M13 6h4a2 2 0 0 1 2 2v3 M11 18H7a2 2 0 0 1-2-2v-3"></path></svg>Face swap</button>
      <button role="tab" aria-selected="false" aria-disabled="true" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-radius: 16px; border: 1px solid transparent; background: transparent; color: var(--text-3); cursor: not-allowed; font: 500 12px/16px var(--font-ui)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l6 6-9 9H5v-6z M12 6l6 6"></path></svg>Edit · soon</button>
    </div>

    <sc-if value="{{isFs}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: baseline; justify-content: space-between"><span class="t-label c2">Characters</span><span class="t-caption">Matched by gender &amp; age</span></div>
        <div class="hscroll" style="margin: 0 -16px; padding: 4px 16px; gap: 6px">
          <button class="bubble" aria-pressed="true"><img src="/_blob/5d603aae02d27c9370ce9724e81fce7b" alt="" style="object-position: 50% 35%"><span class="bubble-check"><svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px; stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>Ana</button>
          <button class="bubble" aria-pressed="true"><img src="/_blob/615333cb7a7451c46b14f19e5d1cc710" alt=""><span class="bubble-check"><svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px; stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>Milo</button>
          <button class="bubble" aria-pressed="false"><img src="/_blob/d841ff50912394cbfa20e00483e2fecb" alt="">Rose</button>
          <button class="bubble" aria-pressed="false"><img src="/_blob/603ff0cb7d029ea8f9a5e95b09cda895" alt="">Jun</button>
          <button class="bubble" aria-pressed="false"><span class="bubble-face" style="border: 1px dashed var(--border-strong); display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></span>New</button>
        </div>
      </div>
      <div style="margin-top: auto; padding: 0 88px 40px 0"><button class="btn btn-primary btn-lg btn-block">Swap with 2</button></div>
    </sc-if>

    <sc-if value="{{isBlur}}" hint-placeholder-val="{{false}}">
      <div class="opt-row">
        <span class="opt-label">Strength</span>
        <div class="range" style="max-width: 220px" role="slider" aria-label="Blur strength" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60" tabindex="0"><span class="range-track"></span><span class="range-fill" style="width: 60%"></span><span class="range-thumb" style="left: 60%"></span></div>
      </div>
      <span class="t-caption">Blur is always the last step. Other tools run underneath it.</span>
      <div style="margin-top: auto; padding: 0 88px 40px 0; display: flex; gap: 8px">
        <button class="btn btn-secondary btn-lg" style="padding: 0 16px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5 M4 9h11a5 5 0 0 1 0 10h-3"></path></svg>Remove</button>
        <button class="btn btn-primary btn-lg" style="flex: 1">Update</button>
      </div>
    </sc-if>
  </section>

  <button class="assist" aria-label="Open assistant" style="bottom: 44px"><svg class="ic ic-24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.9L19 9.7l-5.2 1.9L12 16.5l-1.8-4.9L5 9.7l5.2-1.8z M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"></path></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"tool":{"editor":"enum","options":["faceswap","blur"],"default":"faceswap"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tool = this.props.tool ?? 'faceswap';
    const on = ['var(--info-border)', 'var(--info-soft)', 'var(--info-text)'];
    const off = ['transparent', 'transparent', 'var(--text-2)'];
    const fs = tool === 'faceswap' ? on : off;
    const bl = tool === 'blur' ? on : off;
    return {
      theme: this.props.theme ?? 'dark', isFs: tool === 'faceswap', isBlur: tool === 'blur',
      fsSel: tool === 'faceswap' ? 'true' : 'false', fsCur: tool === 'faceswap' ? 'true' : 'false', fsRing: tool === 'faceswap' ? 'var(--info-border)' : 'transparent', blurSel: tool === 'blur' ? 'true' : 'false',
      fsBd: fs[0], fsBg: fs[1], fsFg: fs[2], blurBd: bl[0], blurBg: bl[1], blurFg: bl[2]
    };
  }
}
</script>
</body>
</html>
