<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Locke — Editor, desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="locke.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="lk lk-{{theme}} shell" style="min-height: 960px">
  <div class="shell-nav"><dc-import name="DesktopSidebar" active="editor" theme="{{theme}}" hint-size="100%,960px"></dc-import></div>

  <main class="shell-main" style="position: relative">
    <header style="padding: 18px 32px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
      <a href="EditorPickDesktop.dc.html" class="icon-btn" aria-label="Back to picker"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <h1 class="t-title-m clamp1" style="flex: 1 1 200px">Café scene</h1>
      <button class="chip chip-sm" aria-pressed="true"><svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18 M8 6H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3 M16 6h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-3"></path></svg>Compare</button>
      <div class="toolbar"><button class="icon-btn" aria-label="Zoom out"><svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button><span class="t-label" style="width: 36px; text-align: center">Fit</span><button class="icon-btn" aria-label="Zoom in"><svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></button></div>
      <button class="icon-btn" aria-label="Save to documents"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"></path></svg></button>
      <button class="icon-btn" aria-label="Download"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11 M7 10l5 5 5-5 M5 20h14"></path></svg></button>
    </header>

    <div class="split" style="display: flex; gap: 24px; padding: 0 32px 32px; align-items: flex-start">
      <div style="flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <div style="position: relative; border-radius: 20px; overflow: hidden; background: var(--image-bg); aspect-ratio: 3 / 2">
          <img src="/_blob/b98f848812490c10d9dfbf0ebffcc2f1" alt="Current image, with blur" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: contrast(1.06) saturate(1.12) blur(2.5px); transform: scale(1.02)">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 50%; overflow: hidden">
            <img src="/_blob/b98f848812490c10d9dfbf0ebffcc2f1" alt="" style="position: absolute; left: 0; top: 0; height: 100%; width: 200%; max-width: none; object-fit: cover; filter: contrast(1.06) saturate(1.12)">
          </div>
          <div class="compare-line" style="left: 50%" role="slider" aria-label="Compare position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" tabindex="0"><div class="compare-knob" style="left: 1px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7l-5 5 5 5 M15 7l5 5-5 5"></path></svg></div></div>
          <span class="tile-tag" style="left: 12px; top: 12px">Before blur</span>
          <span class="tile-tag" style="left: auto; right: 12px; top: 12px">Blur</span>
        </div>

        <div style="display: flex; align-items: baseline; gap: 10px"><h2 class="t-title-s">History</h2><span class="t-caption">Steps apply in order · blur is always last</span></div>
        <div role="list" aria-label="History" style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
          <a role="listitem" href="#" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--text-2)"><img src="/_blob/b98f848812490c10d9dfbf0ebffcc2f1" alt="" style="width: 96px; height: 64px; border-radius: 12px; object-fit: cover; filter: saturate(.65) brightness(.9)"><span class="t-label">Original</span></a>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-3); margin-bottom: 22px"><path d="M9 6l6 6-6 6"></path></svg>
          <a role="listitem" href="#" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--text-2)"><img src="/_blob/b98f848812490c10d9dfbf0ebffcc2f1" alt="" style="width: 96px; height: 64px; border-radius: 12px; object-fit: cover"><span class="t-label">Enhanced</span></a>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-3); margin-bottom: 22px"><path d="M9 6l6 6-6 6"></path></svg>
          <a role="listitem" href="#" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--text-2)"><img src="/_blob/b98f848812490c10d9dfbf0ebffcc2f1" alt="" style="width: 96px; height: 64px; border-radius: 12px; object-fit: cover; filter: contrast(1.06) saturate(1.12)"><span class="t-label">Ana + Milo</span></a>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-3); margin-bottom: 22px"><path d="M9 6l6 6-6 6"></path></svg>
          <div role="listitem" aria-current="true" style="display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 6px; border-radius: 18px; background: var(--info-soft); box-shadow: inset 0 0 0 1px var(--info-border)">
            <span style="width: 96px; height: 64px; border-radius: 12px; overflow: hidden; display: block"><img src="/_blob/b98f848812490c10d9dfbf0ebffcc2f1" alt="" style="width: 100%; height: 100%; object-fit: cover; filter: blur(2px)"></span>
            <span style="display: flex; flex-direction: column; gap: 6px; padding-right: 6px"><span class="t-label">Blur · 40</span><button class="btn btn-secondary btn-sm" style="min-height: 32px"><svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5 M4 9h11a5 5 0 0 1 0 10h-3"></path></svg>Remove blur</button></span>
          </div>
        </div>
      </div>

      <aside class="card" aria-label="Tools" style="flex: 0 1 340px; min-width: 300px; padding: 16px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 72px">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; border: 1px solid var(--border)">
          <span class="flow-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2 M12 19v2 M3 12h2 M19 12h2 M5.6 5.6 7 7 M17 17l1.4 1.4 M5.6 18.4 7 17 M17 7l1.4-1.4 M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column"><span class="t-title-s" style="font-size: 15px">Enhance</span><span class="t-caption">Sharper, cleaner pixels</span></span>
          <button class="btn btn-secondary btn-sm">Run</button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 16px; background: var(--info-soft); box-shadow: inset 0 0 0 1px var(--info-border)">
          <div style="display: flex; align-items: center; gap: 12px">
            <span class="flow-icon" style="background: var(--surface-1); color: var(--info-text)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 3v18 M16 5v14 M20 9v6"></path></svg></span>
            <span style="flex: 1; display: flex; flex-direction: column"><span class="t-title-s" style="font-size: 15px">Blur</span><span class="t-caption">Applied · always the last step</span></span>
          </div>
          <div class="range" role="slider" aria-label="Blur strength" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" tabindex="0"><span class="range-track"></span><span class="range-fill" style="width: 40%"></span><span class="range-thumb" style="left: 40%"></span></div>
          <div style="display: flex; gap: 8px"><button class="btn btn-secondary btn-sm">Remove blur</button><button class="btn btn-primary btn-sm" style="flex: 1">Update blur</button></div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 12px; padding: 12px; border-radius: 16px; border: 1px solid var(--border)">
          <div style="display: flex; align-items: center; gap: 12px">
            <span class="flow-icon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M17 20a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M13 6h4a2 2 0 0 1 2 2v3 M11 18H7a2 2 0 0 1-2-2v-3"></path></svg></span>
            <span style="flex: 1; display: flex; flex-direction: column"><span class="t-title-s" style="font-size: 15px">Face swap</span><span class="t-caption">Matched by gender &amp; age · runs under the blur</span></span>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 2px">
            <button class="bubble" aria-pressed="true"><img src="/_blob/5d603aae02d27c9370ce9724e81fce7b" alt="" style="object-position: 50% 35%"><span class="bubble-check"><svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px; stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>Ana</button>
            <button class="bubble" aria-pressed="true"><img src="/_blob/615333cb7a7451c46b14f19e5d1cc710" alt=""><span class="bubble-check"><svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px; stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>Milo</button>
            <button class="bubble" aria-pressed="false"><img src="/_blob/d841ff50912394cbfa20e00483e2fecb" alt="">Rose</button>
            <button class="bubble" aria-pressed="false"><img src="/_blob/603ff0cb7d029ea8f9a5e95b09cda895" alt="">Jun</button>
          </div>
          <button class="btn btn-secondary">Swap with Ana &amp; Milo</button>
        </div>

        <div aria-disabled="true" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; border: 1px dashed var(--border-strong)">
          <span class="flow-icon" style="color: var(--text-3)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l6 6-9 9H5v-6z M12 6l6 6"></path></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column"><span class="t-title-s c3" style="font-size: 15px">Edit</span><span class="t-caption">Add or remove things</span></span>
          <span class="pill">Soon</span>
        </div>
      </aside>
    </div>

    <button class="assist" aria-label="Open assistant" style="position: absolute; right: 24px; bottom: 24px"><svg class="ic ic-24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.9L19 9.7l-5.2 1.9L12 16.5l-1.8-4.9L5 9.7l5.2-1.8z M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"></path></svg></button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
